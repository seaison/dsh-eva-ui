<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-eva-magi-theme —— 浏览器半边测试台</title>
<style>
  /* 只用于测试台的排版，与被测皮肤无关 */
  body{font:13px/1.6 ui-monospace,Menlo,monospace;margin:24px;background:#111;color:#ddd}
  h1{font-size:15px}
  pre{white-space:pre-wrap}
</style>
</head>
<body>
<h1>dsh-eva-magi-theme —— 浏览器半边测试台</h1>
<p>模拟 <code>window.__ModuleLoader__</code> 与一个假的 <code>ctx</code>，在真实 DOM 里跑完
<code>apply()</code> 的全流程：注册、注入、挂载、选项、回收。</p>
<pre id="RESULT">not-run</pre>

<script>
// 必须在被测文件之前定义：它是浏览器半边的唯一入口契约。
window.__ModuleLoader__ = {
  load(definition) {
    window.__CAPTURED_DEFINITION__ = definition;
  },
};
</script>
<script src="../lib/client.js"></script>
<script>
(async () => {
  "use strict";
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: Boolean(ok), detail: detail ?? "" });
  const PACKAGE = "dsh-eva-magi-theme";
  const OPTIONS_KEY = PACKAGE + ":options";

  let definition;
  try {
    definition = window.__CAPTURED_DEFINITION__;
    check("客户端半边调用了 __ModuleLoader__.load", Boolean(definition));
    check("模块 id 等于包名（解析器据此匹配 ./client 导出）", definition.id === PACKAGE, definition.id);

    // 被测代码不 require 任何模块：给了 require 也不该被调用。
    const exports = definition.factory(() => {
      throw new Error("浏览器半边不应 require 任何模块");
    });
    check("exports.apply 是函数", typeof exports.apply === "function");
    check("exports.inject 只依赖 theme 服务", JSON.stringify(exports.inject) === '["theme"]', JSON.stringify(exports.inject));
    check("PALETTE 导出 107 个令牌", Object.keys(exports.PALETTE).length === 107, String(Object.keys(exports.PALETTE).length));
    check("DEFAULT_OPTIONS 导出 14 个开关", Object.keys(exports.DEFAULT_OPTIONS).length === 14, Object.keys(exports.DEFAULT_OPTIONS).join(","));

    // ---- 假的 Cordis 上下文：记录 effect 与令牌层调用，能真正回收 ----
    const makeCtx = (remote) => {
      const state = { effects: [], tokenCalls: [], tokenDisposed: 0, injects: [] };
      return {
        state,
        ...(remote ? { remote } : {}),
        // 模拟 Cordis 的作用域注入：依赖就绪时用子上下文回调。
        // remote.session 这类作用域服务必须走 inject 才会被建立（实机验证过）。
        inject(deps, callback) {
          state.injects.push(deps);
          callback({ remote: remote || {}, effect: (fn) => { const d = fn(); return d; } });
        },
        effect(fn, label) {
          const dispose = fn();
          state.effects.push({ label, dispose });
          return dispose;
        },
        theme: {
          overrideTokens(source, tokens) {
            state.tokenCalls.push({ source, tokens });
            return () => { state.tokenDisposed += 1; };
          },
        },
      };
    };

    // 从干净状态开始，否则上一次运行的残留会污染断言
    try { localStorage.removeItem(OPTIONS_KEY); } catch {}
    try { sessionStorage.removeItem(PACKAGE + ":booted"); } catch {}

    // ================= 实例 1：默认选项 =================
    const ctx = makeCtx();
    exports.apply(ctx);

    check("apply 注册了 4 个 effect（样式表 / 装饰层 / 开机序列 / 令牌层）", ctx.state.effects.length === 4,
      ctx.state.effects.map((e) => e.label).join(" | "));
    check("每个 effect 都返回了可回收的 dispose", ctx.state.effects.every((e) => typeof e.dispose === "function"));

    // —— 令牌层 ——
    const call = ctx.state.tokenCalls[0];
    check("令牌层走官方 overrideTokens 通道", ctx.state.tokenCalls.length === 1);
    check("令牌层 source 是包名", call && call.source === PACKAGE, call && call.source);
    const entries = call ? Object.entries(call.tokens) : [];
    check("令牌层含 107 个 --dsw-alias-* 键", entries.length === 107 && entries.every(([k]) => k.startsWith("--dsw-alias-")),
      String(entries.length));
    check("每个令牌都是 { light, dark } 双值字符串",
      entries.every(([, v]) => v && typeof v.light === "string" && typeof v.dark === "string" && v.light && v.dark));

    // —— 样式表 ——
    const styleTag = document.head.querySelector('style[data-plugin-css="' + PACKAGE + ':skin"]');
    check("皮肤样式表已注入 <head> 且带 data-plugin-css 标记", Boolean(styleTag));
    let rules = [];
    try { rules = Array.from(styleTag.sheet.cssRules).map((r) => r.cssText); } catch (error) {
      check("样式表可读（CSSOM）", false, String(error));
    }
    check("样式表被浏览器成功解析（规则数 > 10，无语法性丢规则）", rules.length > 10, "规则数 " + rules.length);
    check("含硬边规则 --dsw-radius-panel:0px", rules.some((t) => t.includes("--dsw-radius-panel") && t.includes("0px")));
    check("含扫描线规则 .eva-magi-scan", rules.some((t) => t.includes(".eva-magi-scan")));
    check("含明朝体标题规则（只作用于 h1~h3）", rules.some((t) => t.includes("Hiragino Mincho ProN") && t.includes("h1")));
    check("含等宽数字规则 tabular-nums", rules.some((t) => t.includes("tabular-nums")));

    // —— 装饰层：CRT + 结构框架 + 仪表簇 + 标签 ——
    const layer = document.body.querySelector(".eva-magi-layer");
    check("装饰层已挂到 <body>", Boolean(layer));
    check("装饰层不拦截指针事件（永不挡操作）", Boolean(layer) && getComputedStyle(layer).pointerEvents === "none",
      layer ? getComputedStyle(layer).pointerEvents : "-");
    const q = (sel) => (layer ? layer.querySelectorAll(sel).length : 0);
    check("CRT 四层齐全（网格/场同步带/暗角/扫描线）",
      q(".eva-magi-grid") === 1 && q(".eva-magi-beam") === 1 && q(".eva-magi-vig") === 1 && q(".eva-magi-scan") === 1,
      `grid=${q(".eva-magi-grid")} beam=${q(".eva-magi-beam")} vig=${q(".eva-magi-vig")} scan=${q(".eva-magi-scan")}`);
    check("结构框架：内嵌框 + 四个角标", q(".eva-frame") === 1 && q(".eva-corner") === 4, "角标 " + q(".eva-corner"));
    check("左右刻度尺都在", q(".eva-edge") === 2, String(q(".eva-edge")));
    check("顶边压力线与底部危险条纹都在", q(".eva-magi-top") === 1 && q(".eva-hazard") === 1);
    check("标签 3 个（正面峰谷 2 + 背面合并后的余额 1）", q(".eva-tag") === 3, String(q(".eva-tag")));
    check("仪表簇含竖排汉字标签 + 方块流 16 格",
      q(".eva-hud-vlabel") === 1 && q(".eva-blocks i") === 16,
      `vlabel=${q(".eva-hud-vlabel")} blocks=${q(".eva-blocks i")}`);

    // —— 仪表读数是真实的，不是假遥测 ——
    const clockText = layer.querySelector(".eva-clock")?.textContent ?? "";
    check("時刻 是真实时钟（HH:MM:SS）", /^\d{2}:\d{2}:\d{2}$/.test(clockText), clockText);
    const viewText = layer.querySelector(".eva-view")?.textContent ?? "";
    check("表示 取自真实视口尺寸", /^\d+×\d+$/.test(viewText), viewText);
    const stateText = layer.querySelector(".eva-state")?.textContent ?? "";
    check("状態 取自真实色板", stateText === "DARK" || stateText === "LIGHT", stateText);
    const fit = layer.querySelector(".eva-corner-stack")?.dataset.fit ?? "";
    check("仪表簇有自动避让档位（无输入框时默认 full）", fit === "full", fit);

    // —— 开机序列 ——
    const boot = document.body.querySelector(".eva-boot");
    check("开机序列已挂载（含明朝体标题与进度方块）",
      Boolean(boot) && Boolean(boot.querySelector(".jp")) && boot.querySelectorAll(".bar i").length === 14);
    check("开机序列不拦截指针事件", Boolean(boot) && getComputedStyle(boot).pointerEvents === "none");
    check("开机序列会话标记已写入", (() => { try { return sessionStorage.getItem(PACKAGE + ":booted") === "1"; } catch { return false; } })());

    // —— <html> 上的开关标记 ——
    const root = document.documentElement;
    check("根元素带 data-eva-magi", root.hasAttribute("data-eva-magi"));
    check("默认扫描线关（用户要求先去掉）", root.getAttribute("data-eva-scan") === "off", root.getAttribute("data-eva-scan"));
    check("默认硬边开", root.getAttribute("data-eva-edges") === "hard", root.getAttribute("data-eva-edges"));
    check("默认明朝体标题开", root.getAttribute("data-eva-mincho") === "on", root.getAttribute("data-eva-mincho"));
    check("默认网格关（避免默认就上测绘底纹）", root.getAttribute("data-eva-grid") === "off", root.getAttribute("data-eva-grid"));
    check("默认场同步带关（那条滚动的白线，已按要求去掉）", root.getAttribute("data-eva-beam") === "off", root.getAttribute("data-eva-beam"));
    check("默认结构框架开", root.getAttribute("data-eva-chrome") === "on", root.getAttribute("data-eva-chrome"));
    check("默认仪表簇开", root.getAttribute("data-eva-hud") === "on", root.getAttribute("data-eva-hud"));
    check("扫描线浓度写进自定义属性", root.style.getPropertyValue("--eva-scan-strength") !== "");

    // —— 峰谷计价规则单测（用已知时刻断言，不依赖当前时间）——
    // 北京时间 = UTC+8；这些用例覆盖高峰窗口的两端、周末、法定节假日、调休上班日
    const bj = (y, m, d, h, min) => Math.floor(Date.UTC(y, m - 1, d, h - 8, min || 0) / 1000);
    const P = exports.pricingStateAt;
    // 注意别用 2026-10-05：那天虽是周一，却落在国庆假期内，正确答案是 holiday/空闲。
    // 这个用例最初就是写错在这里，被测试自己抓出来了。
    check("周一 10:00（北京）= 高峰（用假期外的 10-12）", P(bj(2026, 10, 12, 10)).peak === true,
      JSON.stringify(P(bj(2026, 10, 12, 10))));
    check("周四 09:00（北京）= 高峰（窗口起点含）", P(bj(2026, 10, 8, 9)).peak === true);
    check("周四 12:00（北京）= 空闲（窗口终点不含）", P(bj(2026, 10, 8, 12)).peak === false);
    check("周四 15:00（北京）= 高峰", P(bj(2026, 10, 8, 15)).peak === true);
    check("周四 18:00（北京）= 空闲", P(bj(2026, 10, 8, 18)).peak === false);
    check("周四 08:00（北京）= 空闲（午前空档）", P(bj(2026, 10, 8, 8)).peak === false);
    check("周六 10:00（北京）= 空闲且 reason=weekend", (() => {
      const st = P(bj(2026, 10, 10, 10)); return st.peak === false && st.reason === "weekend";
    })(), JSON.stringify(P(bj(2026, 10, 10, 10))));
    check("既是周末又在假期内（10-03 周六·国庆）= reason=holiday（假期优先，才和跨天倒计时一致）", (() => {
      const st = P(bj(2026, 10, 3, 10)); return st.peak === false && st.reason === "holiday";
    })(), JSON.stringify(P(bj(2026, 10, 3, 10))));
    check("国庆假期内的周三 10:00 = 空闲且 reason=holiday", (() => {
      const st = P(bj(2026, 10, 7, 10)); return st.peak === false && st.reason === "holiday";
    })(), JSON.stringify(P(bj(2026, 10, 7, 10))));
    check("假期结束后的周四 10:00 恢复高峰", P(bj(2026, 10, 8, 10)).peak === true);
    check("超出节假日清单覆盖的年份会标 inferred", (() => {
      const st = P(bj(2027, 3, 1, 10)); return st.peak === true && st.inferred === false;
    })() === true && P(bj(2027, 3, 1, 4)).inferred === true,
      JSON.stringify(P(bj(2027, 3, 1, 4))));
    const nextAt = exports.nextPricingChangeAt(bj(2026, 10, 8, 10));
    check("高峰中 10:00 的下一切换点是当日 12:00", nextAt === bj(2026, 10, 8, 12),
      new Date(nextAt * 1000).toISOString());
    check("空闲中 12:30 的下一切换点是当日 14:00", exports.nextPricingChangeAt(bj(2026, 10, 8, 12, 30)) === bj(2026, 10, 8, 14));

    // —— 设置面板：仪表可点，面板改的是同一份选项 ——
    const hudEl = layer.querySelector(".eva-hud");
    check("仪表可点，而整个装饰层仍然不可点（不挡应用）",
      getComputedStyle(hudEl).pointerEvents === "auto" && getComputedStyle(layer).pointerEvents === "none",
      `hud=${getComputedStyle(hudEl).pointerEvents} layer=${getComputedStyle(layer).pointerEvents}`);
    check("仪表带按钮语义（键盘可达）",
      hudEl.getAttribute("role") === "button" && hudEl.getAttribute("tabindex") === "0");

    const panel = layer.querySelector(".eva-panel");
    check("设置面板已建好且默认收起", Boolean(panel) && panel.hidden === true);
    const swCount = panel.querySelectorAll(".eva-sw").length;
    const rangeCount = panel.querySelectorAll('input[type="range"]').length;
    check("开关是判决印章：承認 实心、否定 描边（两态背景不同）", (() => {
      const sws = [...panel.querySelectorAll(".eva-sw")];
      globalThis.__EVA_MAGI_THEME__.set("rings", false);
      const off = sws.find((b) => b.getAttribute("aria-checked") === "false");
      globalThis.__EVA_MAGI_THEME__.set("rings", true);
      const on = sws.find((b) => b.getAttribute("aria-checked") === "true");
      if (!on || !off) return false;
      const onBg = getComputedStyle(on).backgroundColor;
      const offBg = getComputedStyle(off).backgroundColor;
      return offBg === "rgba(0, 0, 0, 0)" && onBg !== offBg && onBg !== "rgba(0, 0, 0, 0)";
    })(), (() => {
      const sws = [...panel.querySelectorAll(".eva-sw")];
      const on = sws.find((b) => b.getAttribute("aria-checked") === "true");
      const off = sws.find((b) => b.getAttribute("aria-checked") === "false");
      return on && off ? `承認 ${getComputedStyle(on).backgroundColor} / 否定 ${getComputedStyle(off).backgroundColor}` : "(缺)";
    })());
    check("换成印章后开关尺寸不变（面板布局不动）", (() => {
      const sws = [...panel.querySelectorAll(".eva-sw")];
      const widths = new Set(sws.map((b) => Math.round(b.getBoundingClientRect().width)));
      const heights = new Set(sws.map((b) => Math.round(b.getBoundingClientRect().height)));
      return widths.size === 1 && heights.size === 1;
    })(), (() => {
      const sws = [...panel.querySelectorAll(".eva-sw")];
      return `宽 ${[...new Set(sws.map((b) => Math.round(b.getBoundingClientRect().width)))]} 高 ${[...new Set(sws.map((b) => Math.round(b.getBoundingClientRect().height)))]}`;
    })());

    // —— 模型 / 推理等级选择器（官方 data-slot 钩子，元素在覆盖层之外）——
    const slotRules = [...document.styleSheets].flatMap((sh) => {
      try { return [...sh.cssRules]; } catch { return []; }
    }).filter((r) => r.selectorText && r.selectorText.includes("conversation.input.model"));
    // —— 输入框整体 + 弹出菜单：EVA「内部/外部」面板语言 ——
    const boxRules = [...document.styleSheets].flatMap((sh) => {
      try { return [...sh.cssRules]; } catch { return []; }
    }).filter((r) => r.selectorText && /data-composer-card|data-composer-input|role="menu"/.test(r.selectorText));
    check("输入框/菜单样式用官方钩子（data-composer-card / data-composer-input / role=menu）",
      boxRules.length >= 5, `${boxRules.length} 条规则`);
    check("这些规则不碰尺寸（卡片 877×98、整行 98px 都不许变）", (() => {
      const text = boxRules.map((r) => r.cssText).join(" ").replace(/\s+/g, " ");
      return !/(^|[;{ ])(width|height|min-width|min-height|padding|font-size|display|flex)\s*:/.test(text);
    })());
    check("这些规则只用字面量色（元素在覆盖层之外，var(--eva-*) 取不到）", (() => {
      const text = boxRules.map((r) => r.cssText).join(" ");
      return !/var\(--eva-/.test(text) && /255, 230, 0/.test(text);
    })());
    check("菜单规则带 [data-menu-material] —— 否则被更靠后的同特异性弹层规则盖掉", (() => {
      // 只取直接的属性选择器形式；:is([role=menu],…) 那条弹层规则里的子串也会命中
      // [role="menu"]，所以必须显式排除 :is(
      const menuRules = boxRules.filter((r) =>
        r.selectorText.includes('[role="menu"]') && !r.selectorText.includes(":is("));
      return menuRules.length >= 3 && menuRules.every((r) => r.selectorText.includes("data-menu-material"));
    })(), (() => {
      const menuRules = boxRules.filter((r) =>
        r.selectorText.includes('[role="menu"]') && !r.selectorText.includes(":is("));
      return menuRules.map((r) => (r.selectorText.includes("data-menu-material") ? "✓" : "✗") + r.selectorText.slice(0, 40)).join(" | ");
    })());

    // —— 访问模式（权限）选择器：EVA「内部/外部」面板语言 ——
    const permRules = [...document.styleSheets].flatMap((sh) => {
      try { return [...sh.cssRules]; } catch { return []; }
    }).filter((r) => r.selectorText && r.selectorText.includes("conversation.input.permission"));
    check("权限选择器有专门样式，且只用官方 data-slot 钩子（不碰 Vg9r4q 这类哈希类名）",
      permRules.length >= 2 && permRules.every((r) => !/Vg9r4q/.test(r.selectorText)),
      `${permRules.length} 条规则`);
    check("权限选择器不改尺寸（不碰宽高/内边距/字号/display）", (() => {
      const text = permRules.map((r) => r.cssText).join(" ").replace(/\s+/g, " ");
      return !/(^|[;{ ])(width|height|min-width|min-height|padding|font-size|display|flex)\s*:/.test(text);
    })());
    check("权限选择器 = 黑底 + 硬边内描边 + 左缘危险条纹 + 亮黄字", (() => {
      const text = permRules.map((r) => r.cssText).join(" ");
      return /repeating-linear-gradient/.test(text) &&          // 危险条纹
        /inset/.test(text) &&                                    // 边框用 inset（不占布局）
        /(#ffe600|255, 230, 0)/i.test(text) &&                   // 亮黄
        /(#ff2d2d|255, 45, 45)/i.test(text) &&                   // 危险红
        !/var\(--eva-/.test(text);                               // 层外元素不能用层内变量
    })(), (() => {
      const text = permRules.map((r) => r.cssText).join(" ").replace(/\s+/g, " ");
      return text.slice(0, 150);
    })());

    check("选择器有专门样式，且只用官方 data-slot 钩子（不碰哈希类名）",
      slotRules.length >= 3 && slotRules.every((r) => !/VYXhfG|uWtHQG/.test(r.selectorText)),
      `${slotRules.length} 条规则`);
    check("这些规则只用主题令牌 —— 元素在覆盖层之外，var(--eva-*) 取不到（踩过的坑）", (() => {
      const text = slotRules.map((r) => r.cssText).join(" ");
      return !/var\(--eva-/.test(text) && /var\(--dsw-alias-/.test(text);
    })(), (() => {
      const text = slotRules.map((r) => r.cssText).join(" ");
      const bad = (text.match(/var\(--eva-[a-z-]+\)/g) || []).slice(0, 3);
      return bad.length ? "误用:" + bad.join(",") : "仅主题令牌";
    })());
    check("这些规则不改尺寸（不碰宽高/内边距/字号/display）", (() => {
      const text = slotRules.map((r) => r.cssText).join(" ").replace(/\s+/g, " ");
      return !/(^|[;{ ])(width|height|min-width|min-height|padding|font-size|display|flex)\s*:/.test(text);
    })(), (() => {
      const text = slotRules.map((r) => r.cssText).join(" ").replace(/\s+/g, " ");
      const bad = text.match(/(^|[;{ ])(width|height|min-width|min-height|padding|font-size|display|flex)\s*:/g);
      return bad ? "含:" + bad.join(",") : "未触碰尺寸属性";
    })());

    check("面板含 11 个开关 + 2 个滑杆（浓度 / 仪表尺寸）",
      swCount === 11 && rangeCount === 2, `switch=${swCount} range=${rangeCount}`);
    check("每个开关都带 data-key 与 role=switch",
      [...panel.querySelectorAll(".eva-sw")].every((b) => b.dataset.key && b.getAttribute("role") === "switch"));

    hudEl.click();
    check("点击仪表展开面板", panel.hidden === false);
    check("展开后 aria-expanded 同步", hudEl.getAttribute("aria-expanded") === "true");

    const ringsSw = panel.querySelector('button[data-key="rings"]');
    check("默认太阳系俯视图是「承認」",
      ringsSw.getAttribute("aria-checked") === "true" && ringsSw.textContent === "承認", ringsSw.textContent);
    ringsSw.click();
    check("点开关 → 选项生效并写进 <html> 标记", root.getAttribute("data-eva-rings") === "off");
    check("点开关 → 文本变「否定」且 aria 同步",
      ringsSw.getAttribute("aria-checked") === "false" && ringsSw.textContent === "否定", ringsSw.textContent);
    check("点开关 → 持久化到 localStorage", (() => {
      try { return JSON.parse(localStorage.getItem(OPTIONS_KEY)).rings === false; } catch { return false; }
    })());

    const strength = panel.querySelector('.eva-row[data-key="scanlineStrength"] input[type="range"]');
    check("浓度滑杆按 data-key 定位（不依赖顺序）", Boolean(strength));
    strength.value = "0.25";
    strength.dispatchEvent(new Event("input", { bubbles: true }));
    check("浓度滑杆写入 scanlineStrength", (() => {
      try { return Math.abs(JSON.parse(localStorage.getItem(OPTIONS_KEY)).scanlineStrength - 0.25) < 1e-6; } catch { return false; }
    })());

    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    check("Esc 收起面板", panel.hidden === true);
    hudEl.click();
    document.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    check("点面板外面收起面板", panel.hidden === true);
    // —— 仪表缩放 ——
    check("默认缩放 1.5（写进 --eva-hud-scale）",
      root.style.getPropertyValue("--eva-hud-scale").trim() === "1.5",
      root.style.getPropertyValue("--eva-hud-scale"));
    check("同时写入反向倍率，供面板把自己抵回原尺寸",
      root.style.getPropertyValue("--eva-hud-scale-inv").trim() === String(1 / 1.5),
      root.style.getPropertyValue("--eva-hud-scale-inv"));
    const scaleRange = panel.querySelector('.eva-row[data-key="hudScale"] input[type="range"]');
    check("面板有仪表尺寸滑杆（范围 0.7–2.3、步进 0.05）",
      Boolean(scaleRange) && scaleRange.min === "0.7" && scaleRange.max === "2.3" && scaleRange.step === "0.05",
      scaleRange && `${scaleRange.min}-${scaleRange.max}/${scaleRange.step}`);
    check("默认值 1.5 正好是滑杆范围的中点（「中间大小」）",
      (Number(scaleRange.min) + Number(scaleRange.max)) / 2 === 1.5,
      `${scaleRange.min}~${scaleRange.max}`);
    check("放大空间比上一版更大（上限 2.3 > 1.6）", Number(scaleRange.max) > 1.6);
    scaleRange.value = "1.35";
    scaleRange.dispatchEvent(new Event("input", { bubbles: true }));
    check("拖滑杆 → 改 --eva-hud-scale 并持久化",
      root.style.getPropertyValue("--eva-hud-scale").trim() === "1.35" &&
        (() => { try { return JSON.parse(localStorage.getItem(OPTIONS_KEY)).hudScale === 1.35; } catch { return false; } })(),
      root.style.getPropertyValue("--eva-hud-scale"));
    check("缩放用 transform 实现，且 origin 固定在右下角（放大不会漂）", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return all.includes("--eva-hud-scale") && all.includes("transform-origin");
    })());
    check("角落塞不下时有「抬到输入框上方」兜底，而不是直接消失", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return all.includes("lifted-compact");
    })());
    check("大尺寸下兜底档位会真的触发（模拟 1600 宽窗口算一遍）", (() => {
      // free = 227（实测：输入框右缘 1373、视口 1600）
      const free = 227, GUTTER = 24, scale = 2.3;
      const needFull = 134 * scale + GUTTER, needCompact = 112 * scale + GUTTER;
      // 2.3 倍下两者都不满足 → 必须走 lifted 而不是 hidden
      return free < needFull && free < needCompact;
    })());
    check("整栈宽度被锁定（min-width 已设），避免状态/倒计时文案变化时抽动", (() => {
      const st = layer.querySelector(".eva-corner-stack");
      const min = parseFloat(st.style.minWidth);
      return Number.isFinite(min) && min > 60 && min < 400;
    })(), layer.querySelector(".eva-corner-stack").style.minWidth);
    // —— 右上角 TPS 波形面板 ——
    check("太阳系装饰：铺满全屏 + 缓慢自转 + 旋转原点对准太阳", (() => {
      // 用 CSSOM 逐属性断言：cssText 会把 animation 简写重排（实测是
      // "240s linear 0s infinite normal none running eva-orbit"），正则写死会假失败。
      const rule = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules]; } catch { return []; }
      }).find((r) => r.selectorText === ".eva-rings");
      if (!rule) return false;
      const st = rule.style;
      const mask = st.mask || st.webkitMask || "";
      return /cover/.test(mask) &&
        st.animationName === "eva-orbit" &&
        st.animationDuration === "240s" &&
        st.animationIterationCount === "infinite" &&
        st.transformOrigin === "50% 50%" && st.width === "142vmax" && st.height === "142vmax";
    })(), (() => {
      const rule = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules]; } catch { return []; }
      }).find((r) => r.selectorText === ".eva-rings");
      if (!rule) return "(未找到规则)";
      const st = rule.style;
      return `mask=${st.mask || st.webkitMask} anim=${st.animationName} ${st.animationDuration} origin=${st.transformOrigin} size=${st.width}`;
    })());
    check("太阳系装饰尊重「减少动态效果」设置", (() => {
      const media = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules]; } catch { return []; }
      }).filter((r) => r.media).find((r) => {
        const text = String(r.conditionText || (r.media && r.media.mediaText) || "");
        return text.includes("prefers-reduced-motion");
      });
      if (!media) return false;
      const inner = [...media.cssRules].find((r) => r.selectorText === ".eva-rings");
      return Boolean(inner) && inner.style.animationName === "none";
    })());
    check("装饰元素上确实跑着 eva-orbit 动画（240s）", (() => {
      const el = layer.querySelector(".eva-rings");
      if (!el) return false;
      const cs = getComputedStyle(el);
      return cs.animationName === "eva-orbit" && cs.animationDuration === "240s";
    })(), (() => {
      const el = layer.querySelector(".eva-rings");
      if (!el) return "(无元素)";
      const cs = getComputedStyle(el);
      return `${cs.animationName} / ${cs.animationDuration} / ${cs.animationTimingFunction}`;
    })());

    check("两个方块都常亮（不再闪烁）", (() => {
      const a = layer.querySelector(".eva-tps-head i");
      const b = layer.querySelector(".eva-hud-head i");
      if (!a || !b) return false;
      return getComputedStyle(a).animationName === "none" && getComputedStyle(b).animationName === "none";
    })(), (() => {
      const a = layer.querySelector(".eva-tps-head i");
      return a ? getComputedStyle(a).animationName : "(无元素)";
    })());
    check("TPS 面板高度不随读数位数变化（波形波动时仪表不变大）", (() => {
      const panel = layer.querySelector(".eva-tps");
      const now = layer.querySelector(".eva-tps-now");
      const peak = layer.querySelector(".eva-tps-peak");
      const avg = layer.querySelector(".eva-tps-avg");
      const h = () => Math.round(panel.getBoundingClientRect().height);
      const w = () => Math.round(panel.getBoundingClientRect().width);
      now.textContent = "—"; peak.textContent = "—"; avg.textContent = "—";
      const h1 = h(), w1 = w();
      now.textContent = "88888"; peak.textContent = "88888"; avg.textContent = "88888";
      const h2 = h(), w2 = w();
      now.textContent = "1234567"; peak.textContent = "1234567"; avg.textContent = "1234567";
      const h3 = h(), w3 = w();
      now.textContent = "—"; peak.textContent = "—"; avg.textContent = "—";
      return h1 === h2 && h2 === h3 && w1 === w2 && w2 === w3;
    })(), (() => {
      const panel = layer.querySelector(".eva-tps");
      const now = layer.querySelector(".eva-tps-now");
      const h = () => Math.round(panel.getBoundingClientRect().height);
      now.textContent = "—"; const a = h();
      now.textContent = "88888"; const b = h();
      now.textContent = "—";
      return `— 时 ${a}px / 88888 时 ${b}px`;
    })());

    check("TPS 面板存在且结构完整（头/波形/页脚 + 折线）", (() => {
      const panel = layer.querySelector(".eva-tps");
      if (!panel) return false;
      return Boolean(panel.querySelector(".eva-tps-head")) &&
        Boolean(panel.querySelector("polyline.eva-tps-line")) &&
        Boolean(panel.querySelector(".eva-tps-foot")) &&
        Boolean(panel.querySelector(".eva-tps-now"));
    })());
    check("TPS 面板与下方仪表盘同宽（都用锁定宽度）", (() => {
      const stack = layer.querySelector(".eva-corner-stack").style.minWidth;
      const tps = root.style.getPropertyValue("--eva-tps-width").trim();
      return stack !== "" && tps === stack;
    })(), `stack=${layer.querySelector(".eva-corner-stack").style.minWidth} tps=${root.style.getPropertyValue("--eva-tps-width")}`);
    check("TPS 面板跟随缩放（用同一个 --eva-hud-scale）", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return /\.eva-tps\s*\{[^}]*scale\(var\(--eva-hud-scale/.test(all);
    })());
    check("TPS 面板受「仪表」开关控制（hud off 时隐藏）", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return /data-eva-hud="off"[^{]*\.eva-tps\s*\{[^}]*display:\s*none/.test(all);
    })());
    check("TPS 折线初始有 44 个点（画得出波形）", (() => {
      const pts = layer.querySelector(".eva-tps-line").getAttribute("points") || "";
      return pts.trim().split(/\s+/).length === 44;
    })(), (layer.querySelector(".eva-tps-line").getAttribute("points") || "").trim().split(/\s+/).length + " 点");

    check("推算标记用样式而不是加字（加字会撑宽整栈）", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return all.includes("data-inferred") && /text-decoration:\s*underline/.test(all);
    })());
    check("三条（2 标签 + 仪表）宽度对齐：栈与面都用 stretch，标签内两端对齐", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return /align-items:\s*stretch/.test(all) && /justify-content:\s*space-between/.test(all) &&
        !/\.eva-corner-stack\s*\{[^}]*align-items:\s*flex-end/.test(all);
    })());
    check("面板自身用反向倍率抵消缩放（调仪表不该改面板字号）", (() => {
      const all = [...document.styleSheets].flatMap((sh) => {
        try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
      }).join(" ");
      return all.includes("--eva-hud-scale-inv") && /scale\(var\(--eva-hud-scale-inv/.test(all.replace(/\s/g, ""));
    })());
    check("缩放不影响扫描线滑杆的置灰逻辑", (() => {
      globalThis.__EVA_MAGI_THEME__.set("scanlines", false);
      const dimmed = scaleRange.closest(".eva-row").dataset.dim;
      globalThis.__EVA_MAGI_THEME__.set("scanlines", true);
      return dimmed === undefined || dimmed === "0";
    })());

    check("Console 钩子与面板共用同一通道（__EVA_MAGI_THEME__.set 就是面板的 set）",
      globalThis.__EVA_MAGI_THEME__.set === globalThis.__EVA_MAGI_THEME__.set && typeof globalThis.__EVA_MAGI_THEME__.set === "function");

    // ---- 全局钩子 ----
    const api = globalThis.__EVA_MAGI_THEME__;
    check("暴露了全局开关钩子 __EVA_MAGI_THEME__", Boolean(api) && typeof api.set === "function" && typeof api.reset === "function");

    // ---- 选项行为 ----
    api.set("scanlines", true);
    check("set('scanlines', true) 立刻反映到 DOM（默认是关，所以这一步真的验到了 setter）", root.getAttribute("data-eva-scan") === "on");
    api.set("hardEdges", false);
    check("set('hardEdges', false) 切成 soft", root.getAttribute("data-eva-edges") === "soft");
    api.set("grid", true);
    check("set('grid', true) 打开网格", root.getAttribute("data-eva-grid") === "on");
    let threw = false;
    try { api.set("notAnOption", 1); } catch (error) { threw = true; }
    check("set() 对未知选项抛错（不静默忽略）", threw);
    check("选项写入了 localStorage", (() => {
      try { return JSON.parse(localStorage.getItem(OPTIONS_KEY)).scanlines === true; } catch { return false; }
    })());

    // ================= 回收 =================
    for (const effect of ctx.state.effects) effect.dispose();
    check("回收后皮肤样式表被移除", !document.head.querySelector('style[data-plugin-css="' + PACKAGE + ':skin"]'));
    check("回收后装饰层被移除", !document.body.querySelector(".eva-magi-layer"));
    check("回收后开机序列被移除", !document.body.querySelector(".eva-boot"));
    check("回收后根元素开关标记被清干净",
      !root.hasAttribute("data-eva-magi") && !root.hasAttribute("data-eva-scan") && !root.hasAttribute("data-eva-edges"));
    check("回收后令牌层被注销", ctx.state.tokenDisposed === 1, String(ctx.state.tokenDisposed));

    // ================= 实例 2：选项持久化 =================
    // 上一个实例把 scanlines=true / grid=true / hardEdges=false 写进了 localStorage，
    // 新实例必须在 apply 时就恢复它们 —— 这是「刷新后设置还在」的机制本身。
    // 同时：开机序列的会话标记已写入，所以第二个实例不该再注册那个 effect。
    const ctx2 = makeCtx();
    exports.apply(ctx2);
    check("新实例从 localStorage 恢复了选项（scanlines 仍为 on）", root.getAttribute("data-eva-scan") === "on");
    check("新实例恢复了 grid 开", root.getAttribute("data-eva-grid") === "on");
    check("开机序列每会话只放一次（第二个实例不注册它）", ctx2.state.effects.length === 3,
      String(ctx2.state.effects.length));
    globalThis.__EVA_MAGI_THEME__.reset();
    check("reset() 回到默认值（扫描线关、网格关、硬边恢复）",
      root.getAttribute("data-eva-scan") === "off" && root.getAttribute("data-eva-grid") === "off" &&
        root.getAttribute("data-eva-edges") === "hard",
      `scan=${root.getAttribute("data-eva-scan")} grid=${root.getAttribute("data-eva-grid")} edges=${root.getAttribute("data-eva-edges")}`);
    for (const effect of ctx2.state.effects) effect.dispose();
    try { localStorage.removeItem(OPTIONS_KEY); } catch {}

    // ================= 实例 3~6：点击标签翻面看余额 =================
    // 余额现在是客户端 fetch 宿主路由（/dsh-eva-magi/balance.json）。
    // 把 fetch 打桩，走完「成功 / 无密钥 / 宿主没装 / 网络断」四条路径。
    // 钱包选择与金额归一化属于宿主侧逻辑，由 tools/verify-host.mjs 负责测。
    const realFetch = globalThis.fetch;
    const stubFetch = (impl) => { globalThis.fetch = impl; };
    const settle = () => new Promise((r) => setTimeout(r, 30));
    const mountFresh = () => {
      const c = makeCtx();
      exports.apply(c);
      return { ctx: c, root: document.body.querySelector(".eva-magi-layer") };
    };

    {
      stubFetch(async () => ({ status: 200, json: async () => ({ ok: true, currency: "CNY", balance: 12.34 }) }));
      const { ctx: c3, root: r3 } = mountFresh();
      const tags = r3.querySelector(".eva-tags");
      check("标签块是双面的（正面峰谷 / 背面余额）",
        tags.querySelectorAll(".eva-tags-face").length === 2 && tags.dataset.face === "front");
      check("标签块带按钮语义（键盘可达）",
        tags.getAttribute("role") === "button" && tags.getAttribute("tabindex") === "0");
      tags.click();
      check("点击翻到背面", tags.dataset.face === "back");
      check("翻面时先显示取数中", r3.querySelector(".eva-tag--balance b").textContent === "取得中",
        r3.querySelector(".eva-tag--balance b").textContent);
      await settle();
      check("宿主返回余额 → 显示 ¥12.34", r3.querySelector(".eva-tag--balance b").textContent === "\u00a512.34",
        r3.querySelector(".eva-tag--balance b").textContent);
      check("余额就绪后副文案为「残高」",
        r3.querySelector(".eva-tag--balance small").textContent === "残高");
      check("背面只剩一个余额标签（合并后），显示余额", (() => {
        const tags = r3.querySelectorAll(".eva-tags-back .eva-tag");
        return tags.length === 1 && tags[0].classList.contains("eva-tag--balance") &&
          r3.querySelector(".eva-tag--balance b").textContent === "¥12.34";
      })(), r3.querySelectorAll(".eva-tags-back .eva-tag").length + " 个 / " +
        r3.querySelector(".eva-tag--balance b").textContent);
      check("合并后的余额标签用的是上面那个（LED）样式",
        r3.querySelector(".eva-tag--balance").classList.contains("eva-tag--balance"));
      tags.click();
      check("再点一次翻回正面", tags.dataset.face === "front");
      for (const e of c3.state.effects) e.dispose();
    }

    {
      // 未配置密钥：副文案要说清原因，而不是笼统的"失败"
      stubFetch(async () => ({ status: 200, json: async () => ({ ok: false, code: "NO_KEY" }) }));
      const { ctx: c4, root: r4 } = mountFresh();
      r4.querySelector(".eva-tags").click();
      await settle();
      check("没配密钥 → 取得不可 / 未配置密钥（不编数字）",
        r4.querySelector(".eva-tag--balance b").textContent === "取得不可" &&
          r4.querySelector(".eva-tag--balance small").textContent === "未配置密钥",
        r4.querySelector(".eva-tag--balance b").textContent + "/" + r4.querySelector(".eva-tag--balance small").textContent);
      for (const e of c4.state.effects) e.dispose();
    }

    {
      stubFetch(async () => ({ status: 404, json: async () => ({}) }));
      const { ctx: c5, root: r5 } = mountFresh();
      r5.querySelector(".eva-tags").click();
      await settle();
      check("宿主半边没装上（404）→ 未対応，且皮肤其余部分照常",
        r5.querySelector(".eva-tag--balance b").textContent === "未対応" &&
          Boolean(r5.querySelector(".eva-hud")),
        r5.querySelector(".eva-tag--balance b").textContent);
      for (const e of c5.state.effects) e.dispose();
    }

    {
      stubFetch(async () => { throw new Error("offline"); });
      const { ctx: c6, root: r6 } = mountFresh();
      r6.querySelector(".eva-tags").click();
      await settle();
      check("网络不通 → 取得不可 / 网络失败",
        r6.querySelector(".eva-tag--balance b").textContent === "取得不可" &&
          r6.querySelector(".eva-tag--balance small").textContent === "网络失败",
        r6.querySelector(".eva-tag--balance b").textContent + "/" + r6.querySelector(".eva-tag--balance small").textContent);
      for (const e of c6.state.effects) e.dispose();
      globalThis.fetch = realFetch;
    }
    {
      // 点击 → 背面，8 秒后自动翻回正面（用同一个 CSS transition，动画一致）
      stubFetch(async () => ({ status: 200, json: async () => ({ ok: true, currency: "CNY", balance: 5.5 }) }));
      const c9 = makeCtx();
      exports.apply(c9);
      const r9 = document.body.querySelector(".eva-magi-layer");
      const tags9 = r9.querySelector(".eva-tags");
      tags9.click();
      check("点击后翻到背面", tags9.dataset.face === "back");
      await new Promise((r) => setTimeout(r, 3000));
      check("3 秒时仍在背面（不会提前翻回）", tags9.dataset.face === "back", tags9.dataset.face);
      await new Promise((r) => setTimeout(r, 5500));
      check("8 秒后自动翻回正面", tags9.dataset.face === "front", tags9.dataset.face);
      // 翻转用的是 CSS transition（两面共用），所以来回动画一致
      check("翻面靠 CSS transition 实现（来回同一套动画）", (() => {
        const all = [...document.styleSheets].flatMap((sh) => {
          try { return [...sh.cssRules].map((r) => r.cssText); } catch { return []; }
        }).join(" ");
        return /\.eva-tags\s*\{[^}]*transition:\s*transform/.test(all) && /data-face="back"/.test(all);
      })());
      for (const e of c9.state.effects) e.dispose();
    }

  } catch (error) {
    check("测试台未捕获异常", false, String(error && error.stack ? error.stack : error));
  }

  const failed = results.filter((r) => !r.ok);
  document.getElementById("RESULT").textContent = JSON.stringify({
    total: results.length,
    failed: failed.length,
    failures: failed,
    results,
  });
})();
</script>
</body>
</html>
